<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SITE-84 MAIN</title>

<style>
body{
margin:0;
padding:0;
background:black;
font-family:Arial, sans-serif;
color:white;
overflow-x:hidden;
}

/* 背景扫描线 */
body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:
repeating-linear-gradient(
to bottom,
rgba(255,255,255,0.03),
rgba(255,255,255,0.03) 1px,
transparent 2px,
transparent 4px
);
pointer-events:none;
z-index:999;
}

/* 红色辉光 */
body::after{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
box-shadow:inset 0 0 150px rgba(255,0,0,0.25);
pointer-events:none;
}

/* 主容器 */
.container{
width:90%;
max-width:500px;
margin:auto;
padding-top:40px;
text-align:center;
}

/* Logo */
.logo{
width:150px;
margin:auto;
display:block;
filter:drop-shadow(0 0 20px red);
}

/* 标题 */
.title{
font-size:58px;
letter-spacing:10px;
margin-top:30px;
color:white;
text-shadow:
0 0 10px red,
0 0 20px red,
0 0 40px red;
}

.subtitle{
margin-top:10px;
font-size:18px;
letter-spacing:6px;
color:#aaa;
}

/* 用户卡片 */
.profile{
margin-top:40px;
padding:25px;
border:1px solid rgba(255,0,0,0.4);
background:rgba(20,0,0,0.45);
box-shadow:0 0 25px rgba(255,0,0,0.2);
backdrop-filter:blur(5px);
}

.avatar{
width:120px;
height:120px;
border-radius:12px;
border:2px solid red;
box-shadow:0 0 20px red;
}

.username{
margin-top:15px;
font-size:30px;
font-weight:bold;
}

.role{
margin-top:10px;
font-size:18px;
color:#ff5e5e;
letter-spacing:2px;
}

.status{
margin-top:10px;
color:#00ff88;
font-size:16px;
}

/* 按钮 */
.menu-btn{
display:block;
width:85%;
margin:20px auto;
padding:18px;
text-align:center;
background:#0f0f0f;
border:1px solid #ff0000;
color:white;
text-decoration:none;
font-size:20px;
letter-spacing:3px;
box-shadow:0 0 20px rgba(255,0,0,.5);
transition:.3s;
}

.menu-btn:hover{
background:#a00000;
transform:scale(1.03);
box-shadow:0 0 30px red;
}

/* 聊天室按钮 */
.chat-btn{
display:block;
width:85%;
margin:20px auto;
padding:18px;
text-align:center;
background:#101820;
border:1px solid #00e5ff;
color:white;
text-decoration:none;
font-size:20px;
letter-spacing:3px;
box-shadow:0 0 20px rgba(0,229,255,.4);
transition:.3s;
}

.chat-btn:hover{
background:#003b46;
transform:scale(1.03);
box-shadow:0 0 30px #00e5ff;
}

/* 底部 */
.footer{
margin-top:60px;
padding-bottom:30px;
color:#666;
font-size:14px;
letter-spacing:3px;
}
</style>
</head>

<body>

<div class="container">

<img src="logo.png" class="logo">

<div class="title">SITE-84</div>

<div class="subtitle">
FOUNDATION INTERNAL NETWORK
</div>

<!-- 用户信息 -->
<div class="profile">

<img id="avatar"
class="avatar"
src="https://tr.rbxcdn.com/30DAY-AvatarHeadshot-310C85C8A62E2B3D8E2F3A7A3B8B2A1-Png/150/150/AvatarHeadshot/Png/noFilter">

<div class="username" id="username">
LOADING...
</div>

<div class="role" id="role">
MTF OPERATIVE
</div>

<div class="status">
STATUS : VERIFIED
</div>

</div>

<!-- 功能按钮 -->

<a href="scp.html" class="menu-btn">
SCP DATABASE
</a>

<a href="mtf.html" class="menu-btn">
MTF COMMAND
</a>

<a href="departments.html" class="menu-btn">
DEPARTMENTS
</a>

<a href="events.html" class="menu-btn">
SITE EVENTS
</a>

<a href="status.html" class="menu-btn">
SYSTEM STATUS
</a>

<!-- 聊天室 -->
<a href="chat.html" class="chat-btn">
🛰 INTERNAL CHAT
</a>

<div class="footer">
SITE-84 SECURE NETWORK
</div>

</div>

<script>
const username =
localStorage.getItem("scpUser") || "UNKNOWN";

const role =
localStorage.getItem("scpRole") || "GUEST";

document.getElementById("username").innerText = username;

document.getElementById("role").innerText = role;

// Roblox头像加载
fetch("https://users.roblox.com/v1/usernames/users",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
usernames:[username],
excludeBannedUsers:false
})
})
.then(res=>res.json())
.then(data=>{

if(data.data && data.data.length > 0){

const userId = data.data[0].id;

fetch(`https://thumbnails.roblox.com/v1/users/avatar-headshot?userIds=${userId}&size=150x150&format=Png&isCircular=false`)
.then(res=>res.json())
.then(avatarData=>{

const imageUrl =
avatarData.data[0].imageUrl;

document.getElementById("avatar").src =
imageUrl;

});

}

})
.catch(err=>{
console.log(err);
});
</script>

</body>
</html>
