<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SITE-84 INTERNAL CHAT</title>

<style>

body{
margin:0;
background:#050505;
font-family:Arial;
color:white;
overflow:hidden;
}

.bg{
position:fixed;
width:100%;
height:100%;
background:
linear-gradient(rgba(255,0,0,0.06) 1px, transparent 1px);
background-size:100% 4px;
pointer-events:none;
animation:flicker .15s infinite;
}

@keyframes flicker{
0%{opacity:.95;}
50%{opacity:1;}
100%{opacity:.96;}
}

.top{
height:70px;
background:#0a0a0a;
border-bottom:2px solid #ff0000;
display:flex;
align-items:center;
padding:0 20px;
box-shadow:0 0 25px red;
}

.top h1{
margin:0;
font-size:24px;
color:#ff2b2b;
letter-spacing:4px;
text-shadow:0 0 15px red;
}

.info{
margin-left:auto;
display:flex;
align-items:center;
gap:10px;
}

.info img{
width:45px;
height:45px;
border-radius:50%;
border:2px solid red;
}

.chat{
height:calc(100vh - 150px);
overflow-y:auto;
padding:20px;
}

.msg{
background:#111;
border-left:3px solid red;
margin-bottom:15px;
padding:12px;
animation:fade .3s;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(10px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.name{
font-size:14px;
color:#ff4a4a;
margin-bottom:5px;
}

.role{
font-size:12px;
color:#999;
margin-left:6px;
}

.text{
font-size:16px;
line-height:1.4;
}

.bottom{
height:80px;
background:#0a0a0a;
display:flex;
padding:15px;
gap:10px;
border-top:1px solid #222;
}

.bottom input{
flex:1;
background:#111;
border:1px solid #333;
color:white;
padding:15px;
font-size:16px;
outline:none;
}

.bottom button{
width:120px;
background:#a00000;
border:none;
color:white;
font-size:16px;
cursor:pointer;
}

.bottom button:hover{
background:red;
}

</style>
</head>

<body>

<div class="bg"></div>

<div class="top">

<h1>SITE-84 INTERNAL CHAT</h1>

<div class="info">
<img id="avatar">
<div>
<div id="username"></div>
<div id="role"></div>
</div>
</div>

</div>

<div class="chat" id="chat"></div>

<div class="bottom">
<input id="messageInput" placeholder="ENTER MESSAGE...">
<button onclick="sendMessage()">SEND</button>
</div>

<script>

const pb = "https://site84-night.onrender.com";

const username = localStorage.getItem("scp_username") || "Unknown";
const role = localStorage.getItem("scp_role") || "Personnel";
const avatar = localStorage.getItem("scp_avatar") || "";

document.getElementById("username").innerText = username;
document.getElementById("role").innerText = role;
document.getElementById("avatar").src = avatar;

async function loadMessages(){

const res = await fetch(
pb + "/api/collections/messages/records?sort=-created"
);

const data = await res.json();

const chat = document.getElementById("chat");

chat.innerHTML = "";

data.items.reverse().forEach(msg=>{

chat.innerHTML += `

<div class="msg">

<div class="name">
${msg.username}
<span class="role">
[${msg.role}]
</span>
</div>

<div class="text">
${msg.message}
</div>

</div>

`;

});

chat.scrollTop = chat.scrollHeight;

}

async function sendMessage(){

const input = document.getElementById("messageInput");

if(!input.value) return;

await fetch(
pb + "/api/collections/messages/records",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({

username:username,
role:role,
message:input.value,
avatar:avatar

})
}
);

input.value="";

loadMessages();

}

setInterval(loadMessages,2000);

loadMessages();

</script>

</body>
</html>
