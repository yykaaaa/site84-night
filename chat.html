<!DOCTYPE html>
<html lang="zh">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>SITE-84 INTERNAL CHAT</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#000;
color:white;
overflow:hidden;
}

/* 动态背景 */

body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:
linear-gradient(rgba(255,0,0,.05) 1px, transparent 1px),
linear-gradient(90deg, rgba(255,0,0,.05) 1px, transparent 1px);
background-size:40px 40px;
animation:bgmove 12s linear infinite;
z-index:-2;
}

@keyframes bgmove{

0%{
transform:translateY(0);
}

100%{
transform:translateY(40px);
}

}

/* 扫描线 */

.scan{
position:fixed;
width:100%;
height:100%;
background:
repeating-linear-gradient(
to bottom,
rgba(255,255,255,.03),
rgba(255,255,255,.03) 1px,
transparent 2px,
transparent 5px
);
pointer-events:none;
z-index:99;
}

/* 顶部 */

.top{

height:80px;

background:rgba(0,0,0,.92);

border-bottom:1px solid #222;

display:flex;

align-items:center;

justify-content:space-between;

padding:0 20px;

box-shadow:0 0 20px rgba(255,0,0,.15);

}

.left{

display:flex;
align-items:center;
gap:15px;

}

.logo{

width:50px;

filter:
drop-shadow(0 0 10px rgba(255,0,0,.4));

}

.title{

font-size:28px;

letter-spacing:5px;

text-shadow:
0 0 10px red;

}

.user{

display:flex;
align-items:center;
gap:12px;

}

.avatar{

width:50px;
height:50px;

border-radius:12px;

border:1px solid #333;

box-shadow:0 0 15px rgba(255,0,0,.15);

}

.user-info{

text-align:right;

}

.username{

font-size:16px;

margin-bottom:4px;

}

.role{

font-size:12px;

color:#ff5555;

letter-spacing:2px;

}

/* 聊天区域 */

.chat{

height:calc(100vh - 160px);

overflow-y:auto;

padding:20px;

}

/* 消息 */

.msg{

background:rgba(10,10,10,.95);

border:1px solid #222;

padding:16px;

margin-bottom:14px;

box-shadow:0 0 20px rgba(255,0,0,.08);

animation:fade .3s ease;

}

@keyframes fade{

from{
opacity:0;
transform:translateY(10px);
}

to{
opacity:1;
transform:translateY(0);
}

}

.msg-top{

display:flex;

justify-content:space-between;

margin-bottom:8px;

}

.msg-name{

color:#ff5555;

font-size:15px;

letter-spacing:1px;

}

.msg-role{

font-size:12px;

color:#999;

}

.msg-text{

font-size:16px;

line-height:1.6;

word-break:break-word;

}

/* 底部 */

.bottom{

height:80px;

background:rgba(0,0,0,.95);

border-top:1px solid #222;

display:flex;

padding:15px;

gap:12px;

}

.bottom input{

flex:1;

background:#050505;

border:1px solid #222;

padding:16px;

color:white;

font-size:16px;

outline:none;

transition:.3s;

}

.bottom input:focus{

border-color:red;

box-shadow:0 0 15px rgba(255,0,0,.2);

}

.bottom button{

width:140px;

background:#880000;

border:none;

color:white;

font-size:16px;

letter-spacing:2px;

cursor:pointer;

transition:.3s;

}

.bottom button:hover{

background:red;

box-shadow:0 0 20px rgba(255,0,0,.25);

}

/* 在线 */

.online{

position:absolute;

top:90px;
right:20px;

background:#002200;

border:1px solid #00ff88;

padding:8px 14px;

font-size:12px;

letter-spacing:2px;

color:#00ff88;

}

/* 手机 */

@media(max-width:768px){

.title{
font-size:20px;
}

.bottom button{
width:110px;
font-size:14px;
}

.msg-text{
font-size:15px;
}

}

</style>

</head>

<body>

<div class="scan"></div>

<!-- 顶部 -->

<div class="top">

<div class="left">

<img
src="logo.png"
class="logo"
>

<div class="title">

INTERNAL CHAT

</div>

</div>

<div class="user">

<img
id="avatar"
class="avatar"
src="logo.png"
>

<div class="user-info">

<div
class="username"
id="username">

UNKNOWN

</div>

<div
class="role"
id="role">

PERSONNEL

</div>

</div>

</div>

</div>

<!-- 在线 -->

<div class="online">

SITE-84 NETWORK ONLINE

</div>

<!-- 聊天 -->

<div
class="chat"
id="chat">

</div>

<!-- 输入 -->

<div class="bottom">

<input
id="messageInput"
placeholder="ENTER MESSAGE..."
>

<button
onclick="sendMessage()">

SEND

</button>

</div>

<script>

/* PocketBase */

const pb =
"https://site84-night.onrender.com";

/* 用户 */

const username =
localStorage.getItem("scpUser")
|| "UNKNOWN";

const role =
localStorage.getItem("scpRole")
|| "PERSONNEL";

/* 显示 */

document.getElementById("username")
.innerText = username;

document.getElementById("role")
.innerText = role;

/* Roblox头像 */

fetch(
"https://users.roblox.com/v1/usernames/users",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
usernames:[username],
excludeBannedUsers:false
})
}
)
.then(res=>res.json())
.then(data=>{

if(data.data &&
data.data.length > 0){

const userId =
data.data[0].id;

fetch(
"https://thumbnails.roblox.com/v1/users/avatar-headshot?userIds="
+ userId +
"&size=150x150&format=Png&isCircular=false"
)
.then(res=>res.json())
.then(avatarData=>{

document.getElementById("avatar")
.src =
avatarData.data[0].imageUrl;

});

}

})
.catch(err=>{

console.log(err);

});

/* 加载消息 */

async function loadMessages(){

try{

const res = await fetch(

pb +

"/api/collections/messages/records?sort=-created"

);

const data =
await res.json();

const chat =
document.getElementById("chat");

chat.innerHTML = "";

/* 倒序 */

data.items.reverse().forEach(msg=>{

const div =
document.createElement("div");

div.className = "msg";

div.innerHTML =

'<div class="msg-top">' +

'<div class="msg-name">' +

msg.username +

'</div>' +

'<div class="msg-role">' +

msg.role +

'</div>' +

'</div>' +

'<div class="msg-text">' +

msg.message +

'</div>';

chat.appendChild(div);

});

chat.scrollTop =
chat.scrollHeight;

}catch(err){

console.log(err);

}

}

/* 发送 */

async function sendMessage(){

const input =
document.getElementById("messageInput");

const text =
input.value.trim();

if(text === "")
return;

try{

await fetch(

pb +

"/api/collections/messages/records",

{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

username:username,

role:role,

message:text,

avatar:""

})

}

);

input.value = "";

loadMessages();

}catch(err){

alert("MESSAGE SEND FAILED");

console.log(err);

}

}

/* 回车发送 */

document
.getElementById("messageInput")
.addEventListener(
"keypress",
function(e){

if(e.key === "Enter"){

sendMessage();

}

}
);

/* 自动刷新 */

setInterval(
loadMessages,
2000
);

/* 首次加载 */

loadMessages();

</script>

</body>
</html>
