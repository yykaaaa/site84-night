<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NIGHT - 服务器状态</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#050505;
color:white;
font-family:Arial,Helvetica,sans-serif;
overflow-x:hidden;
}

/* 动态背景 */

body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:
radial-gradient(circle,
rgba(255,0,0,.08),
transparent 70%);
animation:bg 7s infinite alternate;
z-index:-2;
}

@keyframes bg{
0%{
transform:scale(1);
}
100%{
transform:scale(1.15);
}
}

/* 扫描线 */

.scan{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:
repeating-linear-gradient(
to bottom,
rgba(255,0,0,.04),
rgba(255,0,0,.04) 1px,
transparent 3px,
transparent 5px
);
pointer-events:none;
z-index:-1;
}

/* 标题 */

header{
text-align:center;
padding:70px 20px;
}

h1{
font-size:60px;
letter-spacing:8px;
text-shadow:
0 0 15px red,
0 0 30px red;
animation:glow 2s infinite alternate;
}

@keyframes glow{
0%{
text-shadow:
0 0 10px red,
0 0 20px red;
}
100%{
text-shadow:
0 0 20px red,
0 0 40px red;
}
}

.sub{
margin-top:15px;
color:#888;
letter-spacing:5px;
font-size:18px;
}

/* 面板 */

.container{
width:90%;
max-width:900px;
margin:auto;
display:flex;
flex-direction:column;
gap:28px;
padding-bottom:80px;
}

.panel{
background:rgba(0,0,0,.82);
border:1px solid #222;
padding:35px;
position:relative;
overflow:hidden;
transition:.3s;
}

.panel:hover{
transform:translateY(-5px);
border-color:red;
box-shadow:0 0 25px rgba(255,0,0,.3);
}

.panel::before{
content:"";
position:absolute;
top:0;
left:-100%;
width:100%;
height:2px;
background:red;
animation:line 4s linear infinite;
}

@keyframes line{
0%{
left:-100%;
}
100%{
left:100%;
}
}

.label{
display:flex;
align-items:center;
font-size:24px;
margin-bottom:18px;
}

/* 状态点 */

.dot{
width:14px;
height:14px;
background:#00ff66;
border-radius:50%;
margin-right:14px;
animation:pulse 1s infinite alternate;
box-shadow:0 0 12px #00ff66;
}

@keyframes pulse{
0%{
opacity:.4;
transform:scale(.9);
}
100%{
opacity:1;
transform:scale(1.15);
}
}

.value{
font-size:46px;
color:#ff4444;
margin-bottom:15px;
text-shadow:0 0 10px rgba(255,0,0,.4);
}

.info{
color:#999;
font-size:18px;
line-height:1.7;
}

/* 在线人数 */

.players{
margin-top:18px;
font-size:22px;
color:white;
}

.players span{
color:#ff4444;
font-weight:bold;
}

/* 返回 */

.back{
display:block;
width:240px;
margin:50px auto;
padding:18px;
text-align:center;
background:linear-gradient(
90deg,
#550000,
#990000
);
border:1px solid red;
color:white;
text-decoration:none;
font-size:20px;
transition:.3s;
}

.back:hover{
transform:scale(1.03);
box-shadow:0 0 25px rgba(255,0,0,.4);
}

/* 手机版 */

@media(max-width:768px){

h1{
font-size:42px;
}

.value{
font-size:34px;
}

.label{
font-size:20px;
}

.info{
font-size:16px;
}

.players{
font-size:18px;
}

}

</style>
</head>

<body>

<div class="scan"></div>

<header>

<h1>NIGHT</h1>

<div class="sub">
Night 服务器状态监控系统
</div>

</header>

<div class="container">

<!-- 主服务器 -->

<div class="panel">

<div class="label">
<div class="dot"></div>
Night RP-01
</div>

<div class="value">
ONLINE
</div>

<div class="info">
Night 主服务器运行正常
</div>

<div class="players">
在线人数 :
<span id="players">
24
</span>
/40
</div>

</div>

<!-- 收容状态 -->

<div class="panel">

<div class="label">
<div class="dot"></div>
收容状态
</div>

<div class="value">
稳定
</div>

<div class="info">
当前未检测到严重收容失效事件
</div>

</div>

<!-- 威胁等级 -->

<div class="panel">

<div class="label">
<div class="dot"></div>
威胁等级
</div>

<div class="value" id="defcon">
绿色
</div>

<div class="info">
基金会整体威胁等级正常
</div>

</div>

<!-- 当前事件 -->

<div class="panel">

<div class="label">
<div class="dot"></div>
当前事件
</div>

<div class="value" id="event">
无异常
</div>

<div class="info">
当前未发现重大异常活动
</div>

</div>

</div>

<a class="back" href="index.html">
返回 NIGHT
</a>

<script>

/* 假在线人数 */

setInterval(()=>{

let players=
Math.floor(Math.random()*16)+20;

document.getElementById("players")
.innerText=players;

},4000);

/* 威胁等级 */

const defcons=[
"绿色",
"黄色",
"红色"
];

setInterval(()=>{

let random=
Math.floor(Math.random()*defcons.length);

document.getElementById("defcon")
.innerText=defcons[random];

},7000);

/* 当前事件 */

const events=[

"无异常",

"收容突破",

"HCZ封锁",

"096活动",

"MTF部署"

];

setInterval(()=>{

let random=
Math.floor(Math.random()*events.length);

document.getElementById("event")
.innerText=events[random];

},6000);

</script>

</body>
</html>
