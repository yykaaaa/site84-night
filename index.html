<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SITE-84</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#030303;
    color:white;
    font-family:Arial, Helvetica, sans-serif;
    overflow-x:hidden;
    position:relative;
}

/* ================= 背景 ================= */

body::before{
    content:"";
    position:fixed;
    width:220%;
    height:220%;
    left:-60%;
    top:-60%;

    background:
    radial-gradient(circle,
    rgba(255,0,0,0.18),
    transparent 60%);

    animation:bgRotate 18s linear infinite;

    z-index:-6;
}

@keyframes bgRotate{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }
}

/* 红色动态雾 */

.fog{
    position:fixed;
    width:100%;
    height:100%;

    background:
    radial-gradient(circle at 20% 30%,
    rgba(255,0,0,0.12),
    transparent 35%),

    radial-gradient(circle at 80% 70%,
    rgba(255,0,0,0.08),
    transparent 35%),

    radial-gradient(circle at center,
    rgba(255,0,0,0.06),
    transparent 45%);

    animation:fogMove 10s ease-in-out infinite alternate;

    z-index:-5;
}

@keyframes fogMove{

    from{
        transform:translateY(-20px);
    }

    to{
        transform:translateY(20px);
    }
}

/* 扫描线 */

.scanlines{
    position:fixed;
    width:100%;
    height:100%;

    background:
    repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.03),
        rgba(255,255,255,0.03) 1px,
        transparent 2px,
        transparent 4px
    );

    pointer-events:none;
    z-index:-4;
}

/* 粒子 */

.particle{
    position:fixed;
    width:2px;
    height:2px;
    background:red;
    border-radius:50%;
    opacity:0.4;

    animation:float 10s linear infinite;
}

@keyframes float{

    from{
        transform:translateY(100vh);
        opacity:0;
    }

    50%{
        opacity:0.8;
    }

    to{
        transform:translateY(-100vh);
        opacity:0;
    }
}

/* ================= 容器 ================= */

.container{
    width:90%;
    max-width:720px;
    margin:auto;
    padding-top:70px;
    padding-bottom:80px;
}

/* ================= LOGO ================= */

.logo{
    text-align:center;
    margin-bottom:40px;
}

.logo h1{
    font-size:78px;
    letter-spacing:10px;

    animation:
    titleGlow 3s infinite alternate,
    titleGlitch 6s infinite;

    text-shadow:
    0 0 10px rgba(255,255,255,0.3),
    0 0 30px rgba(255,0,0,0.5);
}

@keyframes titleGlow{

    from{
        text-shadow:
        0 0 10px rgba(255,255,255,0.2),
        0 0 25px rgba(255,0,0,0.3);
    }

    to{
        text-shadow:
        0 0 25px rgba(255,255,255,0.8),
        0 0 50px rgba(255,0,0,0.8);
    }
}

/* 随机故障 */

@keyframes titleGlitch{

    0%,90%,100%{
        transform:none;
    }

    92%{
        transform:translateX(-2px);
    }

    94%{
        transform:translateX(2px);
    }

    96%{
        transform:translateX(-1px);
    }
}

/* 打字机 */

.logo p{
    margin-top:12px;
    color:#999;
    font-size:18px;
    letter-spacing:5px;

    overflow:hidden;
    white-space:nowrap;

    border-right:2px solid red;

    width:0;
    margin:auto;

    animation:
    typing 4s steps(30,end) forwards,
    blink 0.8s infinite;
}

@keyframes typing{

    from{
        width:0;
    }

    to{
        width:100%;
    }
}

@keyframes blink{

    50%{
        border-color:transparent;
    }
}

/* ================= ALERT ================= */

.alert{
    position:relative;

    border:1px solid rgba(255,0,0,0.4);

    background:
    linear-gradient(
        90deg,
        rgba(255,0,0,0.10),
        rgba(255,0,0,0.03)
    );

    padding:25px;

    margin-bottom:25px;

    color:#ff5b5b;

    font-size:20px;

    overflow:hidden;

    animation:pulse 2s infinite;
}

@keyframes pulse{

    0%{
        box-shadow:0 0 5px rgba(255,0,0,0.1);
    }

    50%{
        box-shadow:0 0 25px rgba(255,0,0,0.45);
    }

    100%{
        box-shadow:0 0 5px rgba(255,0,0,0.1);
    }
}

/* 故障 */

.glitch::before,
.glitch::after{

    content:attr(data-text);

    position:absolute;

    left:0;
    top:0;

    width:100%;
    height:100%;
}

.glitch::before{
    color:red;
    z-index:-1;

    animation:glitch1 0.15s infinite;
}

.glitch::after{
    color:white;
    z-index:-2;

    animation:glitch2 0.15s infinite;
}

@keyframes glitch1{

    0%{
        transform:translate(0);
    }

    50%{
        transform:translate(-2px,1px);
    }

    100%{
        transform:translate(2px,-1px);
    }
}

@keyframes glitch2{

    0%{
        transform:translate(0);
    }

    50%{
        transform:translate(2px,-1px);
    }

    100%{
        transform:translate(-2px,1px);
    }
}

/* ================= 广播 ================= */

.broadcast{
    position:relative;

    background:rgba(0,0,0,0.85);

    border:1px solid #222;

    padding:18px;

    margin-bottom:30px;

    overflow:hidden;
}

.broadcast-text{

    display:inline-block;

    white-space:nowrap;

    color:#bbb;

    animation:marquee 12s linear infinite;
}

@keyframes marquee{

    from{
        transform:translateX(100%);
    }

    to{
        transform:translateX(-100%);
    }
}

/* ================= 卡片 ================= */

.card{

    position:relative;

    overflow:hidden;

    background:rgba(0,0,0,0.78);

    border:1px solid #222;

    padding:40px;

    margin-bottom:25px;

    transition:0.35s;

    cursor:pointer;

    backdrop-filter:blur(3px);
}

.card:hover{

    transform:
    translateY(-6px)
    scale(1.01);

    border-color:red;

    box-shadow:
    0 0 25px rgba(255,0,0,0.25);
}

/* 扫描线 */

.card::before{

    content:"";

    position:absolute;

    top:0;
    left:-100%;

    width:100%;
    height:2px;

    background:red;

    animation:scan 3s linear infinite;
}

@keyframes scan{

    from{
        left:-100%;
    }

    to{
        left:100%;
    }
}

/* 数据流 */

.card::after{

    content:"DATA STREAM ACTIVE";

    position:absolute;

    bottom:10px;
    right:15px;

    font-size:10px;

    color:rgba(255,0,0,0.3);

    letter-spacing:2px;
}

.card h2{

    font-size:32px;

    margin-bottom:15px;

    animation:textBlink 5s infinite;
}

@keyframes textBlink{

    0%,96%,100%{
        opacity:1;
    }

    97%{
        opacity:0.5;
    }

    98%{
        opacity:1;
    }
}

.card p{

    color:#888;

    font-size:18px;
}

/* ================= 状态栏 ================= */

.status{

    display:flex;

    justify-content:space-between;

    margin-top:30px;

    color:#666;

    font-size:14px;

    letter-spacing:2px;
}

.dot{

    display:inline-block;

    width:8px;
    height:8px;

    background:#00ff66;

    border-radius:50%;

    margin-right:6px;

    animation:dotBlink 1s infinite;
}

@keyframes dotBlink{

    50%{
        opacity:0.3;
    }
}

/* ================= 手机优化 ================= */

@media(max-width:700px){

    .logo h1{
        font-size:58px;
    }

    .card{
        padding:30px;
    }

    .card h2{
        font-size:26px;
    }
}

</style>
</head>

<body>

<div class="fog"></div>
<div class="scanlines"></div>

<!-- 粒子 -->

<div class="particle" style="left:10%; animation-delay:0s;"></div>
<div class="particle" style="left:25%; animation-delay:2s;"></div>
<div class="particle" style="left:40%; animation-delay:4s;"></div>
<div class="particle" style="left:60%; animation-delay:1s;"></div>
<div class="particle" style="left:80%; animation-delay:3s;"></div>
<div class="particle" style="left:90%; animation-delay:5s;"></div>

<div class="container">

    <div class="logo">

        <h1>SITE-84</h1>

        <p>SECURE. CONTAIN. PROTECT.</p>

    </div>

    <div class="alert glitch"
    data-text="SITE ALERT : LOW LEVEL ANOMALOUS ACTIVITY DETECTED">

        SITE ALERT : LOW LEVEL ANOMALOUS ACTIVITY DETECTED

    </div>

    <!-- 广播 -->

    <div class="broadcast">

        <div class="broadcast-text">

            [ 站点广播 ] SITE-84 当前状态：稳定 ｜ 收容协议正常 ｜ 未检测到高危异常 ｜ 
            Alpha-3 小队已进入地下区域 ｜ 服务器运行正常 ｜

        </div>

    </div>

    <!-- 卡片 -->

    <div class="card">
        <h2>部门数据库</h2>
        <p>查看 Site-84 内部部门信息</p>
    </div>

    <div class="card">
        <h2>站点活动</h2>
        <p>查看当前 SCP 收容行动与活动</p>
    </div>

    <div class="card">
        <h2>服务器状态</h2>
        <p>当前服务器在线，响应正常</p>
    </div>

    <div class="card">
        <h2>异常档案</h2>
        <p>访问 SCP 异常项目数据库</p>
    </div>

    <!-- 底部 -->

    <div class="status">

        <div>
            <span class="dot"></span>
            NETWORK ONLINE
        </div>

        <div id="time"></div>

    </div>

</div>

<script>

/* 时间 */

function updateTime(){

    const now = new Date();

    const time =
    now.getHours().toString().padStart(2,'0')
    + ":"
    + now.getMinutes().toString().padStart(2,'0')
    + ":"
    + now.getSeconds().toString().padStart(2,'0');

    document.getElementById("time").innerText = time;
}

setInterval(updateTime,1000);

updateTime();

</script>

</body>
</html>
