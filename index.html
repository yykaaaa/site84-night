<!DOCTYPE html>
<html lang="zh">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>SITE-84 LOGIN</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:black;
color:white;
overflow-x:hidden;
}

/* 背景 */

body::before{

content:"";

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

background:
linear-gradient(rgba(255,0,0,.05) 1px, transparent 1px),
linear-gradient(90deg, rgba(255,0,0,.05) 1px, transparent 1px);

background-size:40px 40px;

animation:bgmove 12s linear infinite;

z-index:-2;

}

@keyframes bgmove{

0%{
transform:translateY(0);
}

100%{
transform:translateY(40px);
}

}

/* 扫描线 */

.scan{

position:fixed;

width:100%;
height:100%;

background:
repeating-linear-gradient(
to bottom,
rgba(255,255,255,.03),
rgba(255,255,255,.03) 1px,
transparent 2px,
transparent 5px
);

pointer-events:none;

z-index:99;

}

/* 主体 */

.container{

width:100%;

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

padding:20px;

}

/* 登录框 */

.login-box{

width:430px;

max-width:100%;

background:rgba(0,0,0,.92);

border:1px solid #222;

padding:40px;

position:relative;

overflow:hidden;

box-shadow:0 0 35px rgba(255,0,0,.15);

}

/* 顶部红线 */

.login-box::before{

content:"";

position:absolute;

top:0;
left:0;

width:100%;
height:2px;

background:red;

}

/* logo */

.logo{

text-align:center;

margin-bottom:20px;

}

.logo img{

width:130px;

filter:
drop-shadow(0 0 15px rgba(255,255,255,.15));

}

/* 标题 */

.title{

text-align:center;

font-size:44px;

letter-spacing:8px;

color:white;

text-shadow:
0 0 10px red,
0 0 25px red;

margin-bottom:10px;

}

.subtitle{

text-align:center;

color:#777;

letter-spacing:4px;

margin-bottom:35px;

font-size:13px;

}

/* 输入 */

.input-group{

margin-bottom:20px;

}

.input-group label{

display:block;

margin-bottom:8px;

color:#999;

letter-spacing:2px;

font-size:13px;

}

.input-group input,
select{

width:100%;

padding:16px;

background:#050505;

border:1px solid #222;

color:white;

font-size:15px;

outline:none;

}

option{

background:black;
color:white;

}

/* 按钮 */

.login-btn,
.skip-btn,
.enter-btn{

width:100%;

padding:18px;

border:none;

color:white;

font-size:18px;

cursor:pointer;

margin-top:12px;

letter-spacing:2px;

}

/* verify */

.login-btn{

background:#990000;

}

/* skip */

.skip-btn{

background:#222;

}

/* enter */

.enter-btn{

background:#006600;

display:none;

}

/* 用户卡 */

.profile{

display:none;

margin-top:25px;

padding:20px;

background:#050505;

border:1px solid #222;

text-align:center;

}

.profile img{

width:120px;

border-radius:12px;

margin-bottom:15px;

border:1px solid #333;

}

.profile h2{

margin-bottom:10px;

font-size:30px;

}

.profile p{

color:#888;

line-height:1.9;

font-size:14px;

white-space:pre-line;

}

/* verified */

.verified{

display:inline-block;

margin-top:12px;

padding:8px 16px;

background:#002200;

border:1px solid #00ff88;

color:#00ff88;

font-size:13px;

letter-spacing:2px;

}

/* 手机 */

@media(max-width:768px){

.title{
font-size:34px;
}

.login-box{
padding:28px;
}

}

</style>

</head>

<body>

<div class="scan"></div>

<div class="container">

<div class="login-box">

<!-- logo -->

<div class="logo">

<img src="logo.png">

</div>

<!-- 标题 -->

<div class="title">

SITE-84

</div>

<div class="subtitle">

PERSONNEL VERIFICATION SYSTEM

</div>

<!-- 用户名 -->

<div class="input-group">

<label>PERSONNEL NAME</label>

<input
type="text"
id="username"
placeholder="Enter Personnel Name"
>

</div>

<!-- 身份 -->

<div class="input-group">

<label>PERSONNEL ROLE</label>

<select id="role">

<option>Researcher</option>

<option>Security Department</option>

<option>Internal Security</option>

<option>MTF Operative</option>

<option>Administrator</option>

<option>Intelligence Agency</option>

<option>Medical Department</option>

<option>Engineering Department</option>

<option>GOC Liaison</option>

<option>D-Class</option>

</select>

</div>

<!-- 按钮 -->

<button
class="login-btn"
id="loginBtn">

VERIFY PERSONNEL

</button>

<button
class="skip-btn"
id="skipBtn">

SKIP LOGIN

</button>

<!-- 用户卡 -->

<div
class="profile"
id="profile">

<img
src="logo.png"
id="avatar"
>

<h2 id="displayName"></h2>

<p id="userInfo"></p>

<div class="verified">

IDENTITY VERIFIED

</div>

</div>

<!-- 进入 -->

<button
class="enter-btn"
id="enterBtn">

ACCESS SITE-84

</button>

</div>

</div>

<script>

/* 获取 */

var loginBtn =
document.getElementById("loginBtn");

var skipBtn =
document.getElementById("skipBtn");

var enterBtn =
document.getElementById("enterBtn");

/* 登录 */

loginBtn.onclick = function(){

var username =
document.getElementById("username").value;

var role =
document.getElementById("role").value;

if(username == ""){

alert("ENTER PERSONNEL NAME");

return;

}

/* 显示身份卡 */

document.getElementById("profile")
.style.display = "block";

/* 显示进入按钮 */

document.getElementById("enterBtn")
.style.display = "block";

/* 名字 */

document.getElementById("displayName")
.innerText = username;

/* 信息 */

var text = "";

text += "STATUS : VERIFIED\n";

text += "ROLE : " + role + "\n";

text += "SITE : NIGHT SITE-84";

/* 写入 */

document.getElementById("userInfo")
.innerText = text;

};

/* 进入主页 */

function goMain(){

window.location.href =
"main.html";

}

/* skip */

skipBtn.onclick = function(){

goMain();

};

/* enter */

enterBtn.onclick = function(){

goMain();

};

</script>

</body>
</html>
