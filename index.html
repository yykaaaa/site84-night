<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SITE-84</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#050505;
    color:white;
    font-family:Arial, Helvetica, sans-serif;
    overflow-x:hidden;
    position:relative;
}

/* 背景动画 */

body::before{
    content:"";
    position:fixed;
    width:200%;
    height:200%;
    top:-50%;
    left:-50%;
    background:
    radial-gradient(circle at center,
    rgba(255,0,0,0.18),
    transparent 60%);
    animation:bgMove 12s linear infinite;
    z-index:-3;
}

@keyframes bgMove{
    0%{
        transform:rotate(0deg);
    }
    100%{
        transform:rotate(360deg);
    }
}

/* 红色雾气 */

.fog{
    position:fixed;
    width:100%;
    height:100%;
    background:
    radial-gradient(circle at 20% 30%,
    rgba(255,0,0,0.08),
    transparent 30%),

    radial-gradient(circle at 80% 70%,
    rgba(255,0,0,0.08),
    transparent 30%);
    
    animation:fogMove 8s ease-in-out infinite alternate;
    z-index:-2;
}

@keyframes fogMove{
    from{
        transform:translateY(-10px);
    }
    to{
        transform:translateY(10px);
    }
}

/* 扫描线 */

.scanlines{
    position:fixed;
    width:100%;
    height:100%;
    background:
    repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.03),
        rgba(255,255,255,0.03) 1px,
        transparent 2px,
        transparent 4px
    );
    pointer-events:none;
    z-index:-1;
}

/* 粒子 */

.particle{
    position:fixed;
    width:2px;
    height:2px;
    background:red;
    opacity:0.3;
    border-radius:50%;
    animation:float 10s linear infinite;
}

@keyframes float{
    from{
        transform:translateY(100vh);
        opacity:0;
    }
    50%{
        opacity:0.5;
    }
    to{
        transform:translateY(-100vh);
        opacity:0;
    }
}

.container{
    width:90%;
    max-width:700px;
    margin:auto;
    padding-top:80px;
    padding-bottom:80px;
}

.logo{
    text-align:center;
    margin-bottom:30px;
}

.logo h1{
    font-size:72px;
    letter-spacing:10px;
    color:white;
    text-shadow:
    0 0 10px rgba(255,255,255,0.4),
    0 0 30px rgba(255,0,0,0.3);
}

.logo p{
    margin-top:10px;
    color:#999;
    letter-spacing:5px;
    font-size:18px;
}

.alert{
    border:1px solid rgba(255,0,0,0.3);
    background:rgba(255,0,0,0.08);
    padding:25px;
    margin-bottom:25px;
    color:#ff5b5b;
    font-size:18px;
    animation:pulse 2s infinite;
}

@keyframes pulse{
    0%{
        box-shadow:0 0 5px rgba(255,0,0,0.1);
    }
    50%{
        box-shadow:0 0 20px rgba(255,0,0,0.3);
    }
    100%{
        box-shadow:0 0 5px rgba(255,0,0,0.1);
    }
}

.broadcast{
    background:black;
    border:1px solid #222;
    padding:20px;
    margin-bottom:30px;
    color:#aaa;
}

.card{
    background:rgba(0,0,0,0.75);
    border:1px solid #222;
    padding:40px;
    margin-bottom:25px;
    transition:0.3s;
    cursor:pointer;
    backdrop-filter:blur(3px);
}

.card:hover{
    transform:translateY(-5px);
    border-color:red;
    box-shadow:0 0 20px rgba(255,0,0,0.25);
}

.card h2{
    font-size:28px;
    margin-bottom:15px;
}

.card p{
    color:#888;
    font-size:18px;
}

.footer{
    text-align:center;
    color:#666;
    margin-top:50px;
    font-size:14px;
}

</style>
</head>

<body>

<div class="fog"></div>
<div class="scanlines"></div>

<!-- 粒子 -->
<div class="particle" style="left:10%; animation-delay:0s;"></div>
<div class="particle" style="left:25%; animation-delay:2s;"></div>
<div class="particle" style="left:40%; animation-delay:4s;"></div>
<div class="particle" style="left:60%; animation-delay:1s;"></div>
<div class="particle" style="left:80%; animation-delay:3s;"></div>

<div class="container">

    <div class="logo">
        <h1>SITE-84</h1>
        <p>SECURE. CONTAIN. PROTECT.</p>
    </div>

    <div class="alert">
        SITE ALERT : LOW LEVEL ANOMALOUS ACTIVITY DETECTED
    </div>

    <div class="broadcast">
        [ 站点广播 ] SITE-84 当前状态：稳定
    </div>

    <div class="card">
        <h2>部门数据库</h2>
        <p>查看 Site-84 内部部门信息</p>
    </div>

    <div class="card">
        <h2>站点活动</h2>
        <p>查看当前 SCP 收容行动与活动</p>
    </div>

    <div class="card">
        <h2>服务器状态</h2>
        <p>当前服务器在线，响应正常</p>
    </div>

    <div class="card">
        <h2>异常档案</h2>
        <p>访问 SCP 异常项目数据库</p>
    </div>

    <div class="footer">
        SITE-84 INTERNAL NETWORK
    </div>

</div>

</body>
</html>
