<!DOCTYPE html>
<html lang="zh-CN">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SITE-84</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#000;
color:white;
font-family:Arial,sans-serif;
overflow-x:hidden;
animation:fadeIn 1.2s ease;
}

/* 扫描线 */

body::after{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
pointer-events:none;
background:
repeating-linear-gradient(
to bottom,
rgba(255,255,255,0.02),
rgba(255,255,255,0.02) 1px,
transparent 1px,
transparent 3px
);
opacity:0.15;
}

/* 页面 */

.container{
max-width:760px;
margin:auto;
padding:50px 20px;
position:relative;
z-index:2;
}

/* logo */

.logo{
width:110px;
display:block;
margin:auto;
margin-bottom:25px;
filter:invert(1);
opacity:0.95;
}

/* 标题 */

.title{
text-align:center;
font-size:42px;
letter-spacing:5px;
margin-bottom:14px;
font-weight:bold;
}

/* 打字机 */

.typing{
text-align:center;
color:#888;
margin-bottom:45px;
font-size:14px;
letter-spacing:2px;
overflow:hidden;
white-space:nowrap;
border-right:2px solid #666;
width:0;
margin-left:auto;
margin-right:auto;
animation:
typing 4s steps(30,end) forwards,
blink .8s infinite;
}

/* warning */

.warning{
border:1px solid #1b1b1b;
background:#050505;
padding:15px;
margin-bottom:30px;
color:#888;
font-size:13px;
}

/* 卡片 */

.card{
display:block;
text-decoration:none;
color:white;
border:1px solid #1c1c1c;
background:#050505;
padding:24px;
margin-bottom:18px;
transition:0.25s;
position:relative;
overflow:hidden;
}

/* hover */

.card:hover{
transform:translateY(-2px);
border-color:#444;
background:#090909;
}

/* 左边线 */

.card::before{
content:"";
position:absolute;
left:0;
top:0;
width:2px;
height:100%;
background:#444;
opacity:0;
transition:0.3s;
}

.card:hover::before{
opacity:1;
}

/* 标题 */

.card h2{
margin-bottom:8px;
font-size:20px;
}

/* 描述 */

.card p{
color:#777;
font-size:14px;
}

/* footer */

.footer{
margin-top:50px;
text-align:center;
color:#333;
font-size:12px;
letter-spacing:2px;
}

/* 动画 */

@keyframes fadeIn{
from{
opacity:0;
transform:translateY(8px);
}
to{
opacity:1;
transform:translateY(0);
}
}

@keyframes typing{
from{
width:0;
}
to{
width:280px;
}
}

@keyframes blink{
50%{
border-color:transparent;
}
}

</style>

</head>

<body>

<div class="container">

<img
class="logo"
src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/11/SCP_Foundation_%28emblem%29.svg/2048px-SCP_Foundation_%28emblem%29.svg.png"
>

<div class="title">
SITE-84
</div>

<div class="typing">
SECURE. CONTAIN. PROTECT.
</div>

<div class="warning">
[ SITE NOTICE ] 未授权访问将被记录并上报站点安保系统
</div>

</a>

</a>

<p>进入 SITE-84 官方通讯频道</p>
</a>

<div class="footer">

</div>

</div>

</body>
