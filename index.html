<!DOCTYPE html><html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>site84-night</title>  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle at center, #111827 0%, #020617 60%, #000000 100%);
      font-family: Arial, sans-serif;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .stars {
      position: fixed;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 1;
    }

    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: white;
      border-radius: 50%;
      animation: twinkle 3s infinite ease-in-out;
    }

    @keyframes twinkle {
      0%, 100% {
        opacity: 0.2;
      }
      50% {
        opacity: 1;
      }
    }

    .container {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 40px;
      border: 1px solid rgba(0,255,255,0.2);
      border-radius: 24px;
      background: rgba(255,255,255,0.03);
      backdrop-filter: blur(12px);
      box-shadow:
        0 0 30px rgba(0,255,255,0.2),
        0 0 80px rgba(0,100,255,0.15);
    }

    h1 {
      font-size: 64px;
      letter-spacing: 4px;
      color: #67e8f9;
      text-shadow:
        0 0 10px #06b6d4,
        0 0 20px #06b6d4,
        0 0 40px #0891b2;
      margin-bottom: 20px;
      animation: glow 2s infinite alternate;
    }

    @keyframes glow {
      from {
        text-shadow:
          0 0 10px #06b6d4,
          0 0 20px #06b6d4;
      }

      to {
        text-shadow:
          0 0 20px #67e8f9,
          0 0 40px #22d3ee,
          0 0 80px #0891b2;
      }
    }

    p {
      color: #cbd5e1;
      font-size: 18px;
      margin-bottom: 30px;
    }

    .button {
      display: inline-block;
      padding: 14px 32px;
      border-radius: 999px;
      text-decoration: none;
      color: white;
      background: linear-gradient(90deg,#06b6d4,#2563eb);
      transition: 0.3s;
      box-shadow: 0 0 20px rgba(37,99,235,0.5);
    }

    .button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 30px rgba(37,99,235,0.9);
    }

    .grid {
      position: absolute;
      width: 200%;
      height: 200%;
      background-image:
        linear-gradient(rgba(0,255,255,0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,255,255,0.08) 1px, transparent 1px);
      background-size: 50px 50px;
      transform: perspective(500px) rotateX(75deg);
      animation: moveGrid 15s linear infinite;
      bottom: -60%;
      z-index: 0;
    }

    @keyframes moveGrid {
      from {
        transform: perspective(500px) rotateX(75deg) translateY(0);
      }

      to {
        transform: perspective(500px) rotateX(75deg) translateY(50px);
      }
    }
  </style></head><body>
  <div class="stars" id="stars"></div>
  <div class="grid"></div>  <div class="container">
    <h1>site84-night</h1>
    <p>Cyber Night System Online</p>
    <a class="button" href="#">ENTER</a>
  </div>  <script>
    const stars = document.getElementById('stars');

    for (let i = 0; i < 120; i++) {
      const star = document.createElement('div');
      star.classList.add('star');

      star.style.left = Math.random() * 100 + '%';
      star.style.top = Math.random() * 100 + '%';

      star.style.animationDuration = (Math.random() * 3 + 2) + 's';
      star.style.opacity = Math.random();

      stars.appendChild(star);
    }
  </script></body>
</html>
