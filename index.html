<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SITE-84 LOGIN</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#000;
overflow:hidden;
color:white;
}

/* 背景 */

body::before{
content:"";
position:fixed;
width:100%;
height:100%;
background:
linear-gradient(rgba(255,0,0,.05) 1px, transparent 1px),
linear-gradient(90deg, rgba(255,0,0,.05) 1px, transparent 1px);
background-size:40px 40px;
animation:bgmove 12s linear infinite;
z-index:-2;
}

@keyframes bgmove{

0%{
transform:translateY(0);
}

100%{
transform:translateY(40px);
}

}

/* 扫描线 */

.scan{
position:fixed;
width:100%;
height:100%;
background:
repeating-linear-gradient(
to bottom,
rgba(255,255,255,.03),
rgba(255,255,255,.03) 1px,
transparent 2px,
transparent 5px
);
pointer-events:none;
z-index:99;
}

/* 中心 */

.container{
width:100%;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

/* 登录框 */

.login-box{
width:430px;
max-width:100%;
background:rgba(0,0,0,.9);
border:1px solid #222;
padding:40px;
position:relative;
overflow:hidden;
box-shadow:0 0 35px rgba(255,0,0,.15);
}

.login-box::before{
content:"";
position:absolute;
top:0;
left:-100%;
width:100%;
height:2px;
background:red;
animation:lineMove 4s linear infinite;
}

@keyframes lineMove{

0%{
left:-100%;
}

100%{
left:100%;
}

}

/* LOGO */

.logo{
text-align:center;
margin-bottom:20px;
}

.logo img{
width:130px;
animation:float 4s ease-in-out infinite;
}

@keyframes float{

0%{
transform:translateY(0);
}

50%{
transform:translateY(-8px);
}

100%{
transform:translateY(0);
}

}

/* 标题 */

.title{
text-align:center;
font-size:44px;
letter-spacing:8px;
text-shadow:
0 0 10px red,
0 0 25px red;
margin-bottom:10px;
}

.subtitle{
text-align:center;
color:#777;
letter-spacing:4px;
margin-bottom:35px;
font-size:13px;
}

/* 输入框 */

.input-group{
margin-bottom:20px;
}

.input-group label{
display:block;
margin-bottom:8px;
color:#999;
letter-spacing:2px;
font-size:13px;
}

.input-group input{
width:100%;
padding:16px;
background:#050505;
border:1px solid #222;
color:white;
font-size:15px;
outline:none;
}

.input-group input:focus{
border-color:red;
box-shadow:0 0 15px rgba(255,0,0,.2);
}

/* 按钮 */

.login-btn{
width:100%;
padding:18px;
background:linear-gradient(90deg,#550000,#aa0000);
border:none;
color:white;
font-size:18px;
letter-spacing:3px;
cursor:pointer;
transition:.3s;
}

.login-btn:hover{
background:red;
}

/* 用户信息 */

.profile{
display:none;
margin-top:25px;
padding:20px;
background:#050505;
border:1px solid #222;
text-align:center;
}

.profile img{
width:120px;
border-radius:12px;
margin-bottom:15px;
}

.profile h2{
margin-bottom:10px;
}

.profile p{
color:#888;
line-height:1.8;
}

/* 进入 */

.enter-btn{
display:none;
width:100%;
margin-top:20px;
padding:18px;
background:#006600;
border:none;
color:white;
font-size:18px;
cursor:pointer;
transition:.3s;
}

.enter-btn:hover{
background:#00aa00;
}

.error{
margin-top:15px;
color:#ff4444;
display:none;
text-align:center;
}

</style>
</head>

<body>

<div class="scan"></div>

<div class="container">

<div class="login-box">

<div class="logo">
<img src="logo.png">
</div>

<div class="title">
SITE-84
</div>

<div class="subtitle">
ROBLOX PERSONNEL LOGIN
</div>

<div class="input-group">

<label>ROBLOX USERNAME</label>

<input
type="text"
id="username"
placeholder="Enter Roblox Username"
>

</div>

<button class="login-btn" onclick="loginRoblox()">

VERIFY PERSONNEL

</button>

<div class="error" id="error">

USER NOT FOUND

</div>

<div class="profile" id="profile">

<img id="avatar">

<h2 id="displayName"></h2>

<p id="userInfo"></p>

</div>

<button class="enter-btn" id="enterBtn"
onclick="enterSite()">

ACCESS SITE-84

</button>

</div>

</div>

<script>

async function loginRoblox(){

let username =
document.getElementById("username").value.trim();

let error =
document.getElementById("error");

error.style.display = "none";

if(username === "") return;

try{

const response = await fetch(
"https://users.roblox.com/v1/usernames/users",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
usernames:[username],
excludeBannedUsers:false
})
}
);

const data = await response.json();

if(!data.data || data.data.length === 0){

error.style.display = "block";
return;

}

const user = data.data[0];

const userId = user.id;

const avatarResponse = await fetch(
`https://thumbnails.roblox.com/v1/users/avatar-headshot?userIds=${userId}&size=420x420&format=Png&isCircular=false`
);

const avatarData = await response.json();

document.getElementById("profile")
.style.display = "block";

document.getElementById("enterBtn")
.style.display = "block";

document.getElementById("avatar")
.src = avatarData.data[0].imageUrl;

document.getElementById("displayName")
.innerText = user.name;

document.getElementById("userInfo")
.innerHTML = `

USER ID : ${userId}
<br>
CLEARANCE : RESEARCHER
<br>
STATUS : VERIFIED

`;

}catch(e){

error.style.display = "block";

}

}

function enterSite(){

document.body.innerHTML = `

<div style="
width:100%;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
background:black;
color:#00ff66;
font-family:monospace;
">

<h1 style="margin-bottom:20px;">
ACCESS GRANTED
</h1>

<div>
CONNECTING TO SITE-84...
</div>

</div>

`;

setTimeout(()=>{

window.location.href = "main.html";

},2500);

}

</script>

</body>
</html>
