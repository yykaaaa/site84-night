<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SITE-84 LOGIN</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#000;
overflow:hidden;
color:white;
}

/* 动态背景 */

body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:
linear-gradient(rgba(255,0,0,.05) 1px, transparent 1px),
linear-gradient(90deg, rgba(255,0,0,.05) 1px, transparent 1px);
background-size:40px 40px;
animation:bgmove 12s linear infinite;
z-index:-2;
}

@keyframes bgmove{

0%{
transform:translateY(0);
}

100%{
transform:translateY(40px);
}

}

/* 扫描线 */

.scan{
position:fixed;
width:100%;
height:100%;
background:
repeating-linear-gradient(
to bottom,
rgba(255,255,255,.03),
rgba(255,255,255,.03) 1px,
transparent 2px,
transparent 5px
);
pointer-events:none;
z-index:99;
}

/* 粒子 */

.particles{
position:fixed;
width:100%;
height:100%;
overflow:hidden;
z-index:-1;
}

.particle{
position:absolute;
width:2px;
height:2px;
background:red;
opacity:.4;
animation:float 10s linear infinite;
}

@keyframes float{

0%{
transform:translateY(100vh);
opacity:0;
}

10%{
opacity:.5;
}

100%{
transform:translateY(-10vh);
opacity:0;
}

}

/* 容器 */

.container{
width:100%;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

/* 登录框 */

.login-box{
width:430px;
max-width:100%;
background:rgba(0,0,0,.92);
border:1px solid #222;
padding:40px;
position:relative;
overflow:hidden;
box-shadow:0 0 35px rgba(255,0,0,.15);
animation:fadeUp 1s ease;
}

@keyframes fadeUp{

from{
opacity:0;
transform:translateY(20px);
}

to{
opacity:1;
transform:translateY(0);
}

}

.login-box::before{
content:"";
position:absolute;
top:0;
left:-100%;
width:100%;
height:2px;
background:red;
animation:lineMove 4s linear infinite;
}

@keyframes lineMove{

0%{
left:-100%;
}

100%{
left:100%;
}

}

/* LOGO */

.logo{
text-align:center;
margin-bottom:20px;
}

.logo img{
width:130px;
animation:logoFloat 4s ease-in-out infinite;
filter:
drop-shadow(0 0 10px rgba(255,255,255,.15))
drop-shadow(0 0 25px rgba(255,0,0,.25));
}

@keyframes logoFloat{

0%{
transform:translateY(0);
}

50%{
transform:translateY(-8px);
}

100%{
transform:translateY(0);
}

}

/* 标题 */

.title{
text-align:center;
font-size:44px;
letter-spacing:8px;
text-shadow:
0 0 10px red,
0 0 25px red;
margin-bottom:10px;
animation:flicker 3s infinite;
}

@keyframes flicker{

0%,18%,22%,25%,53%,57%,100%{
opacity:1;
}

20%,24%,55%{
opacity:.5;
}

}

.subtitle{
text-align:center;
color:#777;
letter-spacing:4px;
margin-bottom:35px;
font-size:13px;
}

/* 输入 */

.input-group{
margin-bottom:20px;
}

.input-group label{
display:block;
margin-bottom:8px;
color:#999;
letter-spacing:2px;
font-size:13px;
}

.input-group input,
select{
width:100%;
padding:16px;
background:#050505;
border:1px solid #222;
color:white;
font-size:15px;
outline:none;
transition:.3s;
}

.input-group input:focus,
select:focus{
border-color:red;
box-shadow:0 0 15px rgba(255,0,0,.2);
}

option{
background:black;
color:white;
}

/* 按钮 */

.login-btn,
.skip-btn{

width:100%;
padding:18px;
border:none;
color:white;
font-size:18px;
cursor:pointer;
transition:.3s;
margin-top:12px;
letter-spacing:2px;

}

.login-btn{
background:linear-gradient(90deg,#550000,#aa0000);
}

.login-btn:hover{
background:red;
box-shadow:0 0 20px rgba(255,0,0,.25);
}

.skip-btn{
background:#222;
}

.skip-btn:hover{
background:#444;
}

/* 用户卡 */

.profile{
display:none;
margin-top:25px;
padding:20px;
background:#050505;
border:1px solid #222;
text-align:center;
animation:fade .5s;
}

@keyframes fade{

from{
opacity:0;
transform:translateY(10px);
}

to{
opacity:1;
transform:translateY(0);
}

}

.profile img{
width:120px;
border-radius:12px;
margin-bottom:15px;
box-shadow:0 0 20px rgba(255,0,0,.2);
border:1px solid #333;
}

.profile h2{
margin-bottom:10px;
font-size:30px;
}

.profile p{
color:#888;
line-height:1.9;
font-size:14px;
}

/* VERIFIED */

.verified{
display:inline-block;
margin-top:12px;
padding:8px 16px;
background:#002200;
border:1px solid #00ff88;
color:#00ff88;
font-size:13px;
letter-spacing:2px;
}

/* 进入按钮 */

.enter-btn{
display:none;
width:100%;
margin-top:20px;
padding:18px;
background:#006600;
border:none;
color:white;
font-size:18px;
cursor:pointer;
transition:.3s;
letter-spacing:2px;
}

.enter-btn:hover{
background:#00aa00;
}

/* 手机 */

@media(max-width:768px){

.title{
font-size:34px;
}

.login-box{
padding:28px;
}

}

</style>
</head>

<body>

<div class="scan"></div>

<div class="particles" id="particles"></div>

<div class="container">

<div class="login-box">

<div class="logo">
<img src="logo.png">
</div>

<div class="title">
SITE-84
</div>

<div class="subtitle">
PERSONNEL VERIFICATION SYSTEM
</div>

<!-- 用户名 -->

<div class="input-group">

<label>PERSONNEL NAME</label>

<input
type="text"
id="username"
placeholder="Enter Personnel Name"
>

</div>

<!-- 身份 -->

<div class="input-group">

<label>PERSONNEL ROLE</label>

<select id="role">

<option>Researcher</option>

<option>Security Department</option>

<option>Internal Security</option>

<option>MTF Operative</option>

<option>Administrator</option>

<option>Intelligence Agency</option>

<option>Medical Department</option>

<option>Engineering Department</option>

<option>GOC Liaison</option>

<option>D-Class</option>

</select>

</div>

<!-- 按钮 -->

<button class="login-btn">

VERIFY PERSONNEL

</button>

<button class="skip-btn">

SKIP LOGIN

</button>

<!-- 用户信息 -->

<div class="profile" id="profile">

<img id="avatar" src="logo.png">

<h2 id="displayName"></h2>

<p id="userInfo"></p>

<div class="verified">
IDENTITY VERIFIED
</div>

</div>

<button class="enter-btn" id="enterBtn">

ACCESS SITE-84

</button>

</div>

</div>

<script>

/* 粒子 */

const particles =
document.getElementById("particles");

for(let i=0;i<60;i++){

let p =
document.createElement("div");

p.classList.add("particle");

p.style.left =
Math.random()*100+"%";

p.style.animationDuration =
(8+Math.random()*10)+"s";

p.style.animationDelay =
Math.random()*5+"s";

particles.appendChild(p);

}

/* 获取按钮 */

const loginBtn =
document.querySelector(".login-btn");

const skipBtn =
document.querySelector(".skip-btn");

const enterBtn =
document.getElementById("enterBtn");

/* 登录 */

loginBtn.addEventListener("click", function(){

let username =
document.getElementById("username").value.trim();

let role =
document.getElementById("role").value;

if(username === ""){

alert("ENTER PERSONNEL NAME");
return;

}

/* 权限 */

const clearances = [

"LEVEL-1",
"LEVEL-2",
"LEVEL-3",
"LEVEL-4",
"O5"

];

let clearance =
clearances[
Math.floor(Math.random()*clearances.length)
];

/* ID */

let rbxId =
"RBX-" + Math.floor(Math.random()*999999);

/* HASH */

let authHash =
"84-" +
Math.random()
.toString(36)
.substring(2,8)
.toUpperCase();

/* SESSION */

let session =
"NIGHT-" +
Math.floor(Math.random()*99999);

/* 显示 */

document.getElementById("profile")
.style.display = "block";

enterBtn.style.display = "block";

document.getElementById("avatar")
.src = "logo.png";

document.getElementById("displayName")
.innerText = username;

document.getElementById("userInfo")
.innerHTML =

"STATUS : VERIFIED<br>" +

"RBX ID : " + rbxId + "<br>" +

"ROLE : " + role + "<br>" +

"CLEARANCE : " + clearance + "<br>" +

"AUTH HASH : " + authHash + "<br>" +

"SESSION : " + session + "<br>" +

"SITE : NIGHT SITE-84";

});

/* 进入主页 */

function goMain(){

document.body.innerHTML = `

<div style="
width:100%;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
background:black;
color:#00ff66;
font-family:monospace;
">

<h1 style="margin-bottom:20px;">
ACCESS GRANTED
</h1>

<div>
CONNECTING TO NIGHT SITE-84...
</div>

</div>

`;

setTimeout(function(){

window.location.href = "main.html";

},2200);

}

/* skip */

skipBtn.addEventListener("click", goMain);

/* enter */

enterBtn.addEventListener("click", goMain);

</script>

</body>
</html>
